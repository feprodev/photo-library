@if (failed()) {
  <span class="fallback" role="img" [attr.aria-label]="alt()">
    <mat-icon>broken_image</mat-icon>
  </span>
} @else {
  <img [ngSrc]="photo().id" [alt]="alt()" width="400" height="600" (error)="failed.set(true)" />
}
@if (favorite()) {
  <mat-icon class="favorite" role="img" aria-hidden="false" aria-label="In favorites">
    favorite
  </mat-icon>
}
