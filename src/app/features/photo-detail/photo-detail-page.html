@if (photo(); as photo) {
  <figure>
    <div class="frame">
      <img
        [ngSrc]="photo.id"
        [alt]="'Photo by ' + photo.author"
        [loaderParams]="{ aspectRatio: photo.width / photo.height }"
        fill
        priority
      />
    </div>
    <figcaption>{{ photo.author }}</figcaption>
  </figure>
  <button matButton="tonal" type="button" (click)="removeFromFavorites()">
    <mat-icon>heart_minus</mat-icon>
    Remove from favorites
  </button>
}
